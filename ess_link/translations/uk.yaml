configuration:
  dongle:
    name: "Адреса донгла"
    description: "IP-адреса або ім'я донгла ESS LINK, за потреби з портом: адреса або адреса:8888. Для одного інвертора достатньо цього поля."
  device_name:
    name: "Назва пристрою"
    description: "Назва пристрою в Home Assistant. Порожньо означає «Інвертор». Якщо інверторів кілька, дайте кожному свою."
  inverters:
    name: "Кілька інверторів"
    description: "Додатковий список, якщо інверторів кілька: кожному своя назва (стане назвою пристрою в Home Assistant) і адреса донгла."
    fields:
      name:
        name: "Назва"
      dongle:
        name: "Адреса донгла"
  mqtt_host:
    name: "Власний MQTT-брокер"
    description: "Адреса або адреса:порт (порт за замовчуванням 1883). Якщо порожньо, береться додаток Mosquitto broker."
  mqtt_user:
    name: "Користувач MQTT"
    description: "Лише для власного брокера. Порожнє значення означає підключення без автентифікації."
  mqtt_password:
    name: "Пароль MQTT"
    description: "Лише для власного брокера."
  verbose:
    name: "Докладний журнал"
    description: "Детальні повідомлення в журналі для діагностики."
