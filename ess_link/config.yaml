name: "ESS LINK"
version: "1.1.0"
slug: ess_link
description: "Показники інвертора Sinexcel / EnSmart SolarAll через донгл ESS LINK у MQTT (лише читання)"
url: "https://github.com/seishio/ess-link-addon"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:want
options:
  verbose: false
schema:
  dongle: str
  mqtt_host: str?
  mqtt_user: str?
  mqtt_password: password?
  verbose: bool
